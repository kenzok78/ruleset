# ============================================================
# 进阶模板：防 DNS 泄漏版
# ============================================================
# 和 config.yaml 的区别只有 DNS 部分（分流规则、策略组完全一样）：
#   - 国内域名 -> 国内 DNS，国外域名 -> 国外 DNS 并指定从代理组出去
#   - 输出 IP 前用 fallback + geoip 校验，防止 DNS 污染拿到假结果
#   - fake-ip-filter 覆盖 NTP / STUN / 游戏机 / 局域网，避免功能异常
#
# 适合：在意 DNS 泄漏、有稳定机场的人
# 不适合：本地网络有奇怪 DNS 拦截、或机场节点不稳定的情况
#         （DNS 一旦走不通会表现为「全部打不开」，排查成本比 config.yaml 高）
#
# 用法和 config.yaml 一样：把 订阅1/订阅2/订阅3 换成自己的链接即可。
# ============================================================

# ---------------- 订阅 ----------------
proxy-providers:
  机场1:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🌐 直连
    url: "订阅1"
  机场2:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🌐 直连
    url: "订阅2"
  机场3:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🌐 直连
    url: "订阅3"

provider-anchor:
  all: &all [机场1, 机场2, 机场3]

proxies:
  - {name: "🌐 直连", type: direct, udp: true}

# ---------------- 锚点 ----------------
# 自定义字段，mihomo 不读它，只用来复用下面的 YAML 片段
# pr = 「可切换线路」通用模板，节点组顺序按需调整
rule-anchor:
  pr: &pr {type: select, proxies: [🚀 节点选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 新加坡自动, ♻️ 集合自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇺🇳 集合节点, 🌍 全部节点, 🌐 直连]}
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ---------------- 全局 ----------------
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ---------------- 嗅探 ----------------
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"   # 只跳过推送域名，不要整段跳过 apple.com

# ---------------- DNS（防泄漏版） ----------------
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  # 这些域名不返回假 IP：时间同步 / STUN 打洞 / 游戏机联机 / 局域网设备
  # 拿到假 IP 会表现为「网页能开，但时间不更新、联机失败」
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_not_cn
    - rule-set:private_domain
    - "+.lan"
    - "+.local"

  # 引导 DNS：只负责解析下面那几个 DoH 服务器自己的域名
  default-nameserver:
    - https://223.5.5.5/dns-query
    - 119.29.29.29

  # 下载机场订阅时用的 DNS —— 这一步不能用远程 DoH，否则会死锁
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 直连域名（命中直连规则）解析用的 DNS
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver-policy:
    # 国内域名 -> 国内 DNS，并关掉 HTTPS/SVCB 查询（qtype 65），避免 CDN 调度错乱
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,microsoftcn_domain,applecn_domain":
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    # 国外域名 -> 国外 DNS，并从 🚀 节点选择 出去
    "rule-set:fakeipfilter_not_cn":
      - https://8.8.8.8/dns-query#🚀 节点选择&disable-qtype-65=true

  # 默认走国外 DoH，通过 🚀 节点选择 出口，带 ECS 让 CDN 就近
  nameserver:
    - https://8.8.8.8/dns-query#🚀 节点选择&ecs=223.5.5.0/24
  fallback:
    - https://8.8.4.4/dns-query#🚀 节点选择
  fallback-filter:
    geoip: true
    geoip-code: CN

# ---------------- 策略组 ----------------
proxy-groups:
