# ---------------- 分流规则 ----------------
# 顺序即优先级，越上面越优先。改动前先看注释。
rules:
  # 0. 可选：拦掉国内域名的 QUIC（443/UDP），强制回落 TCP，让按域名分流真正生效
  #    好处：国内视频站不再因为 QUIC 绕过分流
  #    代价：首次连接略慢（浏览器会自动重试 TCP）
  #    想用就把下面这行前面的 # 去掉
  # - AND,((RULE-SET,cn_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT

  # 1. 局域网与私有地址，永远直连
  - RULE-SET,private_ip,🏠 私有网络,no-resolve
  - RULE-SET,private_domain,🏠 私有网络

  # 2. 直连补充名单（本项目维护）+ 代理补充名单
  - RULE-SET,direct1,🌐 直连
  - RULE-SET,proxylite,🚀 节点选择

  # 3. APNs 推送（放在 Apple 之前，否则会被 apple 规则吃掉）
  - RULE-SET,apple_push,📣 APNs 推送

  # 4. AI 各家单独分流
  - RULE-SET,openai_domain,🔮 OpenAI
  - RULE-SET,claude_domain,🧠 Claude
  - RULE-SET,gemini_domain,🤖 Gemini
  - RULE-SET,muse_domain,✨ Muse
  - RULE-SET,ai_domain,🪄 AI 其他

  # 5. 常用平台
  - RULE-SET,youtube_domain,▶️ YouTube
  - RULE-SET,google_domain,🔍 Google
  - RULE-SET,github_domain,📦 GitHub
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoftcn_domain,🌐 直连
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,applecn_domain,🌐 直连
  - RULE-SET,apple_domain,🍏 Apple
  - RULE-SET,telegram_domain,📲 电报消息
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,netflix_domain,📺 Netflix
  - RULE-SET,paypal_domain,💳 PayPal
  - RULE-SET,hulu_domain,🎬 流媒体
  - RULE-SET,disney_domain,🎬 流媒体
  - RULE-SET,hbo_domain,🎬 流媒体
  - RULE-SET,amazon_domain,🎬 流媒体

  # 6. 国内外兜底
  - RULE-SET,geolocation-!cn,🌐 非中国
  - RULE-SET,cn_domain,🎯 全球直连

  # 7. IP 兜底（放在域名规则之后，避免误伤）
  - RULE-SET,telegram_ip,📲 电报消息,no-resolve
  - RULE-SET,google_ip,🔍 Google,no-resolve
  - RULE-SET,netflix_ip,📺 Netflix,no-resolve
  - RULE-SET,cn_ip,🎯 全球直连,no-resolve

  - MATCH,🐟 漏网之鱼

