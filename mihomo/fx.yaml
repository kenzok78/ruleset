# ============================================================
# 覆写模板（Overwrite / Merge）
# ============================================================
# 本文件**不含订阅和节点**，只有 global / dns / tun / sniffer /
# proxy-groups / rules / rule-providers。
#
# 用法：
#   - Clash Verge Rev：「订阅」→ 右上角「覆写」→ 新建，把本文件内容贴进去
#   - OpenClash：「覆写设置」→ 自定义配置文件，把本文件内容粘进去
#
# 设计上和其他模板不同的一点：直连目标统一写 `DIRECT`（mihomo 内置），
# 不写 `🌐 直连`。因为覆写是叠加在别人生成的配置上的，
# 不能假设主配置里一定定义了 `🌐 直连` 这个 proxy。
#
# 节点组用 include-all + 地区 filter，不绑定任何具体订阅，
# 所以覆写到哪个机场配置上都能用。
# ============================================================

# ---------------- 全局配置 ----------------
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 匹配进程 always/strict/off
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

# ---------------- 流量嗅探 ----------------
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"   # 只跳过推送域名，不要整段跳过 apple.com

# ---------------- 代理模式 ----------------
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ---------------- DNS ----------------
dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  ipv6: false
  # DNS 请求也按分流规则走出去
  respect-rules: true
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  # 模式切换 whitelist/blacklist
  # 黑名单模式表示如果匹配成功则不返回 Fake-IP
  fake-ip-filter-mode: blacklist
  # 白名单只放「必须看到真实 IP」的域名：NTP / STUN / 游戏机联机 / 局域网 / Plex
  # 不要在这里写 geosite:cn —— 那等于让所有国内域名退回 redir-host，
  # 既要加载 11 万条记录做匹配，又让国内站失去 fake-ip 的连接加速。
  # 国内域名拿假 IP 是正常的：命中 cn_domain 规则后走直连，mihomo 会用真实域名去连。
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_not_cn
    - rule-set:private_domain
    - "+.lan"
    - "+.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # respect-rules 下必须有这一段，否则起不来
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "rule-set:private_domain,cn_domain,fakeipfilter_cn":
      - https://dns.alidns.com/dns-query
      - 223.5.5.5
    "rule-set:geolocation-!cn":
      - https://doh.pub/dns-query
      # 用 IP 而不是 dns.cloudflare.com —— 后者在国内解析不到，DoH 还没握手就先挂了
      - https://1.1.1.1/dns-query

# ---------------- 锚点 ----------------
# 覆写场景下没有 `🌐 直连` 这个 proxy，统一用内置的 DIRECT
aipr: &pr {type: select, proxies: [🚀 节点选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 新加坡自动, ♻️ 集合自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇺🇳 集合节点, 🌍 全部节点, DIRECT]}

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ---------------- 策略组 ----------------
proxy-groups:
  - {name: 🚀 节点选择, type: select, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/rocket.svg", proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 新加坡自动, ♻️ 集合自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇺🇳 集合节点, 🌍 全部节点, DIRECT]}

  # --- AI：每家一组 ---
  - {name: 🔮 OpenAI, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/openai.svg"}
  - {name: 🧠 Claude, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/claude.svg"}
  - {name: 🤖 Gemini, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/gemini.svg"}
  - {name: ✨ Muse, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/muse.svg"}
  - {name: 🪄 AI 其他, <<: *pr}

  # --- 平台 ---
  - {name: ▶️ YouTube, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/youtube.svg"}
  - {name: 🔍 Google, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/google.svg"}
  - {name: 🐦 Twitter, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/x.svg"}
  - {name: 📦 GitHub, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/github.svg"}
  - {name: 🪟 Microsoft, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/microsoft.svg"}
  - {name: 🐬 OneDrive, <<: *pr}
  - {name: 🎵 TikTok, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/tiktok.svg"}
  - {name: 📺 Netflix, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/netflix.svg"}
  - {name: 🎬 流媒体, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/film.svg"}
  - {name: 💳 PayPal, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/paypal.svg"}
  - {name: 📲 电报消息, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/telegram.svg"}

  # --- 特殊 ---
  - {name: 🍏 Apple, type: select, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/apple.svg", proxies: [DIRECT, 🚀 节点选择]}
  - {name: 📣 APNs 推送, type: select, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/bell.svg", proxies: [🚀 节点选择, ♻️ 自动选择, DIRECT]}
  - {name: 🎯 全球直连, type: select, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/direct.svg", proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🏠 私有网络, type: select, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/home.svg", proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🌐 非中国, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/globe.svg"}
  - {name: 🐟 漏网之鱼, <<: *pr, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/fish.svg"}

  # --- 地区节点 ---
  - {name: 🇭🇰 香港节点, type: select, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/flag-hk.svg", filter: "(?i)港|hk|hongkong|hong kong"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/flag-jp.svg", filter: "(?i)日|jp|japan"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/flag-us.svg", filter: "(?i)美|us|unitedstates|united states"}
  - {name: 🇸🇬 新加坡节点, type: select, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/flag-sg.svg", filter: "(?i)新加坡|坡|狮城|sg|singapore"}
  - {name: 🇺🇳 集合节点, type: select, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/flag-tw.svg", filter: "(?i)台|tw|taiwan|韩|kr|korea"}

  # --- 自动测速 ---
  - {name: ♻️ 香港自动, type: url-test, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/auto.svg", tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/auto.svg", tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/auto.svg", tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: ♻️ 新加坡自动, type: url-test, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/auto.svg", tolerance: 20, interval: 300, filter: "(?=.*(新加坡|坡|狮城|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$"}
  - {name: ♻️ 集合自动, type: url-test, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/auto.svg", tolerance: 20, interval: 300, filter: "(?i)台|tw|taiwan|韩|kr|korea"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/auto.svg", tolerance: 20, interval: 300}
  - {name: 🌍 全部节点, type: select, include-all: true, icon: "https://raw.githubusercontent.com/kenzok78/ruleset/main/icon/all.svg"}

# ---------------- 分流规则 ----------------
rules:
  # 1. 局域网与私有地址
  - RULE-SET,private_ip,🏠 私有网络,no-resolve
  - RULE-SET,private_domain,🏠 私有网络

  # 2. 自己的补充名单
  - RULE-SET,direct1,DIRECT
  - RULE-SET,proxylite,🚀 节点选择

  # 3. APNs（必须排在 Apple 之前）
  - RULE-SET,apple_push,📣 APNs 推送

  # 4. AI 各家
  - RULE-SET,openai_domain,🔮 OpenAI
  - RULE-SET,claude_domain,🧠 Claude
  - RULE-SET,gemini_domain,🤖 Gemini
  - RULE-SET,muse_domain,✨ Muse
  - RULE-SET,ai_domain,🪄 AI 其他

  # 5. 平台
  - RULE-SET,youtube_domain,▶️ YouTube
  - RULE-SET,google_domain,🔍 Google
  - RULE-SET,github_domain,📦 GitHub
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,🍏 Apple
  - RULE-SET,telegram_domain,📲 电报消息
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,netflix_domain,📺 Netflix
  - RULE-SET,paypal_domain,💳 PayPal
  - RULE-SET,hulu_domain,🎬 流媒体
  - RULE-SET,disney_domain,🎬 流媒体
  - RULE-SET,hbo_domain,🎬 流媒体
